# ورکر ویدیو: سرور اپ با workflow_dispatch صداش می‌زنه؛ تا وقتی کار هست می‌گیره و تموم که شد خارج می‌شه.
# لاگ‌های این مخزن عمومی‌ان: ورودی boot رمزشده‌ست و هیچ‌جا توی env/لاگ نمیاد (اسکریپت از فایل رویداد می‌خونه).
name: run
run-name: run

on:
  workflow_dispatch:
    inputs:
      nonce:
        description: id
        required: true
        type: string
      boot:
        description: sealed
        required: true
        type: string

permissions:
  contents: read

jobs:
  work:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: deps
        run: |
          sudo apt-get update -qq >/dev/null
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          pip install -q --disable-pip-version-check -r requirements.txt
          sudo mkdir -p /mnt/work && sudo chown "$(id -u):$(id -g)" /mnt/work
          df -h / /mnt | tail -n +2

      - name: work
        env:
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          APP_API: ${{ secrets.APP_API }}
          WORK_DIRS: /mnt/work:${{ runner.temp }}
          CLAIM_HOURS: '4.75'
          PYTHONUNBUFFERED: '1'
        run: python -m pipeline.run
